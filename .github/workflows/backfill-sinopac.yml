# 放置路徑：.github/workflows/backfill-sinopac.yml
#
# 一次性回補 SinoPac 式欄位所需的歷史資料，只在手動按下時執行。
#   第一段：股價回補（約 8 分鐘）→ 5/10/20/40 日漲幅、今年以來漲幅
#   第二段：月營收回補（FinMind，約 3.5 小時）→ 三年平均、營收創新高、連續成長月數
#
# 兩段各自 commit：第二段就算中途失敗或逾時，第一段的成果也已經存下來。
# 月營收回補可中斷續跑，log 若顯示「尚未全部完成」就再按一次 Run workflow。
#
# 需要 Secret：FINMIND_TOKEN（之前回補時已設定）

name: 回補 SinoPac 欄位（手動執行）

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: "1/2 股價回補"
        run: python scripts/backfill_price_history.py
        continue-on-error: true

      - name: Commit price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add data/
          git diff --staged --quiet || git commit -m "chore: backfill price history"
          git push

      - name: "2/2 月營收回補（約3.5小時）"
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/backfill_revenue_history.py

      - name: Commit revenue history
        if: always()
        run: |
          git pull --rebase --autostash || true
          git add data/
          git diff --staged --quiet || git commit -m "chore: backfill revenue history"
          git push
