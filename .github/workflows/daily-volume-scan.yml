# 放置路徑：.github/workflows/daily-volume-scan.yml
#
# 排程說明：
# - cron '0 10 * * 1-5' = 週一到週五 UTC 10:00 = 台北時間 18:00
#   台股 13:30 收盤，交易所資料通常 15:00 前後就緒，18:00 執行有足夠緩衝。
# - 為什麼不排除國定假日：
#   假日時交易所 API 會回傳前一交易日的資料，腳本以「交易日期」為 key 寫入，
#   日期已存在就直接覆蓋而非重複累加，所以假日空跑是安全的、不會污染資料。
#   （寫死台灣假日表反而要每年維護，得不償失）
# - 這支只寫 data/volume_history.json 與 data/volume_latest.json，
#   跟月營收腳本的檔案完全分開，兩者不會互相覆蓋。

name: Daily Sector Volume Scan

on:
  schedule:
    - cron: '0 10 * * 1-5'    # 週一至週五，台北時間 18:00
  workflow_dispatch: {}

permissions:
  contents: write

# 避免與月營收排程同時 push 造成衝突：同一時間只跑一個 commit 類工作
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  volume:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run volume script
        run: python scripts/fetch_volume.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 先拉取遠端最新狀態，避免與其他排程的 commit 衝突
          git pull --rebase --autostash || true
          git add data/
          git diff --staged --quiet || git commit -m "chore: daily sector volume $(date -u +%Y-%m-%d)"
          git push
