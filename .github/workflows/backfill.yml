# 放置路徑：.github/workflows/backfill.yml
#
# 用途：回補民國115年（2026）的歷史資料。
# 這支只會在你手動按下按鈕時執行，不會自動跑。
# 有了它，你不用在自己電腦裝 Python，用瀏覽器就能完成回補。
#
# 執行前必須先設定 FINMIND_TOKEN（做法見 README 第六節）

name: 回補歷史資料（手動執行）

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350      # 逐檔抓取可能要跑好幾小時，把上限開大
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run backfill script
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/backfill_history.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: backfill history"
          git push
