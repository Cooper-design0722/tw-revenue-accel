<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股月營收選股</title>
<meta name="description" content="每月自動掃描上市櫃月營收：族群動能、動能延續股，以及可自行篩選並匯出 Excel 的全市場清單。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EFF2F5; --surface:#FFFFFF; --band:#16232F; --ink:#111821; --muted:#5F6A78;
    --rule:#D7DDE4; --rule-soft:#E8ECF1;
    --up:#C4283A; --up-soft:#F6E2E4; --down:#3C7A5A; --base:#3C5A73; --focus:#1F6FEB;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
  .wrap{max-width:1360px;margin:0 auto;padding:0 20px}

  /* ---------- 頁首 ---------- */
  .band{background:var(--band);color:#EDF1F5;padding:26px 0 22px}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#8FA3B5;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--up);display:inline-block;margin-right:6px;vertical-align:middle}
  .eyebrow a{color:#8FA3B5;text-decoration:none;border-bottom:1px solid #33465A}
  .eyebrow a:hover{color:#EDF1F5}
  h1{font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(26px,4.2vw,40px);line-height:1.2;margin:10px 0 6px}
  .lede{color:#A9B8C6;font-size:14px;max-width:48em;margin:0}
  .rule-formula{display:inline-block;margin-top:14px;padding:7px 12px;border:1px solid #33465A;border-radius:3px;font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:#C8D6E2;background:#1D2C3A}
  .rule-formula b{color:#E9838F;font-weight:600}

  .tabs{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
  .tab{all:unset;cursor:pointer;font-family:"Noto Sans TC",sans-serif;font-size:13.5px;font-weight:500;padding:8px 16px;border-radius:3px 3px 0 0;color:#8FA3B5;border:1px solid transparent;border-bottom:2px solid transparent}
  .tab:hover{color:#EDF1F5}
  .tab.active{color:#fff;background:#1D2C3A;border-color:#33465A;border-bottom-color:var(--up)}
  .tab:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

  .stats{display:flex;flex-wrap:wrap;border-top:1px solid #2A3A4A;margin-top:20px;padding-top:16px}
  .stat{padding-right:34px;margin-right:34px;border-right:1px solid #2A3A4A}
  .stat:last-child{border-right:0;margin-right:0;padding-right:0}
  .stat .k{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;color:#8FA3B5;text-transform:uppercase}
  .stat .v{font-family:"IBM Plex Mono",monospace;font-size:23px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:12px;color:#8FA3B5;font-weight:400;margin-left:3px}

  /* ---------- 篩選列 ---------- */
  .toolbar{background:var(--surface);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:20}
  .toolbar-in{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:14px 20px;max-width:1360px;margin:0 auto}
  .field{display:flex;flex-direction:column;gap:4px;position:relative}
  .field label{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
  select,input[type=search]{font-family:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--rule);border-radius:3px;padding:7px 9px;min-width:132px}
  input[type=search]{min-width:180px}
  select:focus-visible,input:focus-visible,th button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
  .count{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--muted);padding-bottom:8px}
  .count b{color:var(--up);font-weight:600}
  .btn{background:none;border:1px solid var(--rule);border-radius:3px;padding:7px 11px;font-family:inherit;font-size:13px;color:var(--muted);cursor:pointer}
  .btn:hover{border-color:var(--muted);color:var(--ink)}
  .btn.primary{background:var(--band);border-color:var(--band);color:#fff;font-weight:500}
  .btn.primary:hover{background:#22364A}

  /* 勾選式多選下拉 */
  .ms-btn{all:unset;cursor:pointer;font-family:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--rule);border-radius:3px;padding:7px 28px 7px 9px;min-width:132px;box-sizing:border-box;display:block;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ms-btn::after{content:'▾';position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:11px}
  .ms-btn:hover{border-color:#B9C2CC}
  .ms-btn:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
  .field.has-selection .ms-btn{border-color:var(--up);color:var(--up);font-weight:500}
  .ms-panel{position:absolute;top:calc(100% + 4px);left:0;z-index:30;background:#fff;border:1px solid var(--rule);border-radius:4px;box-shadow:0 8px 20px rgba(17,24,33,.12);min-width:210px;max-width:300px;max-height:300px;overflow-y:auto;padding:6px}
  .ms-actions{display:flex;gap:4px;padding:2px 2px 8px;border-bottom:1px solid var(--rule-soft);margin-bottom:6px}
  .ms-actions button{all:unset;cursor:pointer;font-family:inherit;font-size:11.5px;color:var(--muted);padding:3px 8px;border-radius:2px}
  .ms-actions button:hover{background:#EEF2F6;color:var(--ink)}
  .ms-item{display:flex;align-items:center;gap:7px;padding:6px;border-radius:2px;cursor:pointer;font-size:13px;user-select:none}
  .ms-item:hover{background:#F7F9FB}
  .ms-item input{margin:0;width:14px;height:14px;accent-color:var(--up);flex-shrink:0}
  .ms-item .cnt{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:#9AA5B1}

  /* ---------- 表格 ---------- */
  main{padding:22px 0 60px}
  .card{background:var(--surface);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:760px}
  thead th{background:#F7F9FB;border-bottom:1px solid var(--rule);text-align:right;padding:0;white-space:nowrap;position:sticky;top:0}
  thead th.txt{text-align:left}
  th button{all:unset;cursor:pointer;display:block;width:100%;padding:9px 8px;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:inherit}
  th button:hover{color:var(--ink);background:#EEF2F6}
  th.sorted button{color:var(--up)}
  th .arrow{font-size:8px;margin-left:2px}
  tbody td{padding:8px;border-bottom:1px solid var(--rule-soft);text-align:right;white-space:nowrap;font-size:13px}
  tbody td.txt{text-align:left}
  tbody tr:hover{background:#FAFCFD}
  .rank{color:#9AA5B1;font-family:"IBM Plex Mono",monospace;font-size:11px}
  .ticker{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px}
  .cname{font-weight:500;max-width:110px;overflow:hidden;text-overflow:ellipsis}
  .cname a{color:inherit;text-decoration:none;border-bottom:1px solid transparent}
  .cname a:hover{border-bottom-color:var(--muted)}
  .chip{display:inline-block;font-size:11px;padding:2px 6px;border-radius:2px;background:#EEF2F6;color:#4A5665;white-space:nowrap}
  .chip.mkt-otc{background:#EAF0EA;color:#4A6350}
  .num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:13px}
  .pos{color:var(--up);font-weight:500}
  .neg{color:var(--down);font-weight:500}
  .pill{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px;color:var(--up);background:var(--up-soft);padding:2px 6px;border-radius:2px}
  .streak{display:inline-flex;gap:1px;align-items:center;justify-content:flex-end}
  .streak s{width:5px;height:11px;background:var(--base);opacity:.32;text-decoration:none;border-radius:1px}
  .streak s.on{opacity:1}
  .streak.hot s.on{background:var(--up)}
  .streak .n{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);margin-left:4px;min-width:12px}
  .streak.hot .n{color:var(--up);font-weight:600}

  /* ---------- 族群動能長條圖 ---------- */
  .ind-head{display:flex;align-items:center;gap:16px;padding:14px 16px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
  .ind-metric{display:flex;gap:4px}
  .mbtn{all:unset;cursor:pointer;font-family:inherit;font-size:13px;padding:6px 14px;border-radius:3px;color:var(--muted);border:1px solid var(--rule)}
  .mbtn:hover{color:var(--ink);border-color:var(--muted)}
  .mbtn.active{background:var(--band);color:#fff;border-color:var(--band);font-weight:500}
  .ind-note{font-size:12px;color:var(--muted);flex:1;min-width:220px}
  .ind-row{display:grid;grid-template-columns:120px 1fr 84px 120px;gap:12px;align-items:center;padding:7px 16px;border-bottom:1px solid var(--rule-soft)}
  .ind-row:hover{background:#FAFCFD}
  .ind-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ind-track{position:relative;height:18px;background:linear-gradient(90deg,transparent 49.8%,var(--rule) 49.8%,var(--rule) 50.2%,transparent 50.2%)}
  .ind-bar{position:absolute;top:3px;height:12px;border-radius:1px}
  .ind-bar.pos{background:var(--up);left:50%}
  .ind-bar.neg{background:var(--down);right:50%}
  .ind-val{font-family:"IBM Plex Mono",monospace;font-size:13px;text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
  .ind-meta{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);text-align:right}
  @media (max-width:720px){ .ind-row{grid-template-columns:88px 1fr 68px;gap:8px} .ind-meta{display:none} }

  .legend{display:flex;gap:16px;align-items:center;padding:10px 14px;background:#F7F9FB;border-top:1px solid var(--rule);font-size:12px;color:var(--muted);flex-wrap:wrap}
  .legend i{display:inline-block;width:3px;height:11px;margin-right:5px;vertical-align:-1px}
  .state{padding:56px 20px;text-align:center;color:var(--muted)}
  .state b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px;font-weight:500}
  .demo-flag{background:#FFF6E5;border:1px solid #E8D5A8;color:#7A5B14;font-size:13px;padding:10px 14px;border-radius:3px;margin-bottom:16px}
  footer{border-top:1px solid var(--rule);padding:20px 0 0;margin-top:26px;font-size:12.5px;color:var(--muted)}
  footer a{color:var(--muted)}
  @media (max-width:640px){ .stat{padding-right:20px;margin-right:20px} .count{margin-left:0;width:100%} }
</style>
</head>
<body>

<header class="band">
  <div class="wrap">
    <div class="eyebrow">
      <span><span class="dot"></span>資料年月 <span id="dataYm" class="mono">—</span></span>
      <span>更新於 <span id="updatedAt" class="mono">—</span></span>
      <span>每月 15 日自動更新</span>
      <span><a href="volume.html">族群資金量能 →</a></span>
    </div>
    <h1 id="pageTitle">動能延續股</h1>
    <p class="lede" id="pageLede"></p>
    <div class="rule-formula" id="pageFormula"></div>

    <div class="tabs">
      <button type="button" class="tab" id="tabIndustry">族群動能</button>
      <button type="button" class="tab active" id="tabMomentum">動能延續股</button>
      <button type="button" class="tab" id="tabAll">自行篩選區</button>
    </div>

    <div class="stats" id="statsBar">
      <div class="stat"><div class="k">全市場家數</div><div class="v" id="statAll">—</div></div>
      <div class="stat" id="statHitBox"><div class="k" id="statHitLabel">符合條件</div><div class="v" id="statHit">—<small id="statPct"></small></div></div>
      <div class="stat" id="statTopBox"><div class="k">最高強度分數</div><div class="v" id="statTop">—</div></div>
      <div class="stat" id="statStreakBox"><div class="k">連續符合 2 個月以上</div><div class="v" id="statStreak">—<small id="statHist"></small></div></div>
    </div>
  </div>
</header>

<div class="toolbar" id="toolbar">
  <div class="toolbar-in">
    <div class="field" id="fMarketField">
      <label>市場</label>
      <button type="button" class="ms-btn" id="fMarketBtn">全部</button>
      <div class="ms-panel" id="fMarketPanel" hidden>
        <div class="ms-actions"><button type="button" data-act="all">全選</button><button type="button" data-act="none">清空</button></div>
        <div class="ms-list" id="fMarketList"></div>
      </div>
    </div>
    <div class="field" id="fSizeField">
      <label>市值規模</label>
      <button type="button" class="ms-btn" id="fSizeBtn">全部</button>
      <div class="ms-panel" id="fSizePanel" hidden>
        <div class="ms-actions"><button type="button" data-act="all">全選</button><button type="button" data-act="none">清空</button></div>
        <div class="ms-list" id="fSizeList"></div>
      </div>
    </div>
    <div class="field" id="fIndField">
      <label>產業別</label>
      <button type="button" class="ms-btn" id="fIndBtn">全部</button>
      <div class="ms-panel" id="fIndPanel" hidden>
        <div class="ms-actions"><button type="button" data-act="all">全選</button><button type="button" data-act="none">清空</button></div>
        <div class="ms-list" id="fIndList"></div>
      </div>
    </div>
    <div class="field" id="fStreakField">
      <label>連續入選</label>
      <select id="fStreak">
        <option value="1">不限</option>
        <option value="2">連 2 個月以上</option>
        <option value="3">連 3 個月以上</option>
      </select>
    </div>
    <div class="field">
      <label for="fQ">搜尋代號／名稱</label>
      <input type="search" id="fQ" placeholder="例：2330 或 台積">
    </div>
    <button class="btn" id="btnReset" type="button">清除條件</button>
    <button class="btn primary" id="btnCsv" type="button">⬇ 匯出 CSV</button>
    <div class="count">顯示 <b id="cShown">0</b> / <span id="cTotal">0</span> 家</div>
  </div>
</div>

<main class="wrap">
  <div id="demoFlag" class="demo-flag" hidden>
    尚未讀到 <code>data/latest.json</code>，目前顯示示範資料。等排程跑過後會自動換成真實資料。
  </div>

  <!-- 個股表格（動能延續股 / 自行篩選區 共用，欄位依分頁切換） -->
  <div class="card" id="stockView">
    <div class="scroll">
      <table id="tbl">
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div id="empty" class="state" hidden><b>目前條件下沒有符合的公司</b><span id="emptyHint">放寬篩選條件試試。</span></div>
  </div>

  <!-- 族群動能 -->
  <div class="card" id="industryView" hidden>
    <div class="ind-head">
      <div class="ind-metric">
        <button type="button" class="mbtn active" data-metric="mom">月增率 MoM</button>
        <button type="button" class="mbtn" data-metric="yoy">年增率 YoY</button>
      </div>
      <div class="ind-note" id="indNote"></div>
    </div>
    <div id="indBars"></div>
    <div class="legend">
      <span><i style="background:#C4283A"></i>成長</span>
      <span><i style="background:#3C7A5A"></i>衰退</span>
      <span>依族群營收總額加總計算，自動以規模加權，不受個別小廠極端數字影響。</span>
    </div>
  </div>

  <footer>
    資料來源：<a href="https://openapi.twse.com.tw/" target="_blank" rel="noopener">臺灣證券交易所 OpenAPI</a>、<a href="https://www.tpex.org.tw/openapi/" target="_blank" rel="noopener">證券櫃檯買賣中心 OpenAPI</a>。
    營收數字為各公司自行申報之合併營收。本頁為個人研究工具，所有數據與篩選結果僅供參考，非投資建議，請自行查證並自負風險。
  </footer>
</main>

<script>
(function(){
  const $ = s => document.querySelector(s);
  let DATA=null, MODE='momentum', ROWS=[], SORT={k:'momentum_score',dir:-1}, IND_METRIC='mom';

  const fmtPct = v => v==null?'—':(v>0?'+':'')+v.toFixed(2)+'%';
  const toYi   = v => v==null?null:v/100000;          // 千元 → 億元
  const fmtYi  = v => v==null?'—':toYi(v).toLocaleString('zh-TW',{maximumFractionDigits:1});
  const cls    = v => v==null?'':(v>=0?'pos':'neg');

  // ---- 欄位定義：兩個分頁共用同一張表，只是欄位組合不同 ----
  const COL = {
    rank:   {k:'rank', label:'#', txt:1, get:(r,i)=>`<span class="rank">${i+1}</span>`},
    code:   {k:'code', label:'股號', txt:1, get:r=>`<span class="ticker">${r.code||''}</span>`},
    name:   {k:'name', label:'公司', txt:1, cell:'cname',
             get:r=>`<a href="https://tw.stock.yahoo.com/quote/${r.code}/revenue" target="_blank" rel="noopener">${r.name||''}</a>`},
    ind:    {k:'industry', label:'產業別', txt:1, get:r=>`<span class="chip">${r.industry||'—'}</span>`},
    size:   {k:'size_tier', label:'市值規模', txt:1,
             get:r=>`<span class="chip ${r.market==='上櫃'?'mkt-otc':''}">${r.market||''} · ${r.size_tier||'未知'}</span>`},
    cap:    {k:'market_cap_k', label:'市值(億)', get:r=>`<span class="num">${fmtYi(r.market_cap_k)}</span>`},
    cumyoy: {k:'cum_yoy', label:'累計年增', get:r=>`<span class="num ${cls(r.cum_yoy)}">${fmtPct(r.cum_yoy)}</span>`},
    curyoy: {k:'cur_yoy', label:'當月年增', get:r=>`<span class="num ${cls(r.cur_yoy)}">${fmtPct(r.cur_yoy)}</span>`},
    mom:    {k:'mom', label:'月增率', get:r=>`<span class="num ${cls(r.mom)}">${fmtPct(r.mom)}</span>`},
    score:  {k:'momentum_score', label:'強度分數',
             get:r=>`<span class="pill">${r.momentum_score!=null?r.momentum_score.toFixed(1):'—'}</span>`},
    streak: {k:'streak', label:'連續', get:r=>streakCell(r.streak)},
    rev:    {k:'cur_revenue_k', label:'當月營收(億)', get:r=>`<span class="num">${fmtYi(r.cur_revenue_k)}</span>`},
  };
  const LAYOUT = {
    momentum: ['rank','code','name','ind','size','cap','cumyoy','curyoy','mom','score','streak','rev'],
    all:      ['rank','code','name','ind','size','cap','cumyoy','curyoy','mom','rev'],
  };

  const MODES = {
    industry: {
      title:'族群動能', isIndustry:true,
      lede:'把個股營收加總到產業別，看整個族群的景氣方向。用總額加總等於自動以規模加權，不會被單一小廠的極端百分比拉歪——族群一起轉強，通常比個股單獨跳動更有訊號價值。',
      formula:'族群當月營收總額　vs　上月／去年同月總額',
    },
    momentum: {
      title:'動能延續股', dataKey:'momentum', defaultSort:'momentum_score', showStreak:true,
      lede:'抓「已經在噴、還沒噴完」的公司——當月與累計年增率都維持在高檔，不看兩者的倍數關係。適合找已經確立成長趨勢、還沒被市場定價完的中大型主流股。',
      formula:'篩選：當月年增率 &gt; 50%　<b>且</b>　累計年增率 &gt; 40%（絕對門檻）',
    },
    all: {
      title:'自行篩選區', dataKey:'all_stocks', defaultSort:'cur_yoy', showStreak:false,
      lede:'全市場上市櫃公司月營收，不套用任何策略篩選。用上方條件自行過濾，或直接匯出 CSV 到 Excel 做自己的分析。',
      formula:'無策略篩選　·　全部個股原始數據',
    },
  };

  const DEMO = {
    data_ym:'115/07（示範）', updated_at:'—', count_all:1972,
    count_momentum:4, count_momentum_streak_2plus:2, history_months:4,
    industries:[
      {industry:'半導體業',count:112,cur_revenue_k:88500000,mom:12.4,yoy:31.2},
      {industry:'電子零組件業',count:98,cur_revenue_k:42300000,mom:8.1,yoy:18.6},
      {industry:'金融業',count:38,cur_revenue_k:52100000,mom:-2.4,yoy:9.1},
      {industry:'鋼鐵工業',count:31,cur_revenue_k:14800000,mom:-6.7,yoy:-11.3}
    ],
    momentum:[
      {code:'9945',name:'示範金屬',market:'上市',industry:'鋼鐵工業',size_tier:'中規模(100-300億)',market_cap_k:28000000,cur_revenue_k:2100000,cur_yoy:92.4,cum_yoy:78.1,mom:6.2,momentum_score:85.3,streak:5},
      {code:'3011',name:'示範材料',market:'上櫃',industry:'半導體業',size_tier:'小規模(0-100億)',market_cap_k:8600000,cur_revenue_k:1350000,cur_yoy:68.9,cum_yoy:55.2,mom:-3.1,momentum_score:62.1,streak:3}
    ],
    all_stocks:[
      {code:'3708',name:'上緯投控',market:'上市',industry:'綠能環保',size_tier:'小規模(0-100億)',market_cap_k:8670000,cur_revenue_k:120000,cur_yoy:534.57,cum_yoy:23.25,mom:1.2},
      {code:'4119',name:'旭富',market:'上市',industry:'生技醫療業',size_tier:'小規模(0-100億)',market_cap_k:7070000,cur_revenue_k:150000,cur_yoy:187.52,cum_yoy:14.21,mom:1.5},
      {code:'6715',name:'嘉基',market:'上市',industry:'電子零組件業',size_tier:'中規模(100-300億)',market_cap_k:26900000,cur_revenue_k:160000,cur_yoy:113.02,cum_yoy:10.24,mom:1.6},
      {code:'5508',name:'永信建',market:'上櫃',industry:'建材營造',size_tier:'中規模(100-300億)',market_cap_k:12180000,cur_revenue_k:320000,cur_yoy:633.65,cum_yoy:60.19,mom:3.2}
    ]
  };

  // ---- 多選篩選 ----
  const MSEL = {market:new Set(), size:new Set(), industry:new Set()};
  const MS = {
    market:  {f:'fMarketField', b:'fMarketBtn', p:'fMarketPanel', l:'fMarketList', get:r=>r.market},
    size:    {f:'fSizeField',   b:'fSizeBtn',   p:'fSizePanel',   l:'fSizeList',   get:r=>r.size_tier},
    industry:{f:'fIndField',    b:'fIndBtn',    p:'fIndPanel',    l:'fIndList',    get:r=>r.industry},
  };

  function buildMs(key, rows){
    const c = MS[key], counts={};
    rows.forEach(r=>{const v=c.get(r); if(v) counts[v]=(counts[v]||0)+1;});
    const uniq = Object.keys(counts).sort((a,b)=>a.localeCompare(b,'zh-Hant'));
    MSEL[key] = new Set([...MSEL[key]].filter(v=>uniq.includes(v)));  // 切分頁後保留仍存在的選項
    $('#'+c.l).innerHTML = uniq.map(v=>`<label class="ms-item"><input type="checkbox" value="${v}" ${MSEL[key].has(v)?'checked':''}><span>${v}</span><span class="cnt">${counts[v]}</span></label>`).join('')
      || '<div style="padding:8px;color:var(--muted);font-size:12.5px">無可選項目</div>';
    updMs(key);
  }
  function updMs(key){
    const c=MS[key], s=MSEL[key];
    $('#'+c.b).textContent = s.size===0?'全部':(s.size===1?[...s][0]:`已選 ${s.size} 項`);
    $('#'+c.f).classList.toggle('has-selection', s.size>0);
  }
  function closeMs(){ Object.values(MS).forEach(c=>$('#'+c.p).hidden=true); }

  Object.entries(MS).forEach(([key,c])=>{
    $('#'+c.b).addEventListener('click', e=>{
      e.stopPropagation();
      const p=$('#'+c.p), open=p.hidden; closeMs(); p.hidden=!open;
    });
    $('#'+c.l).addEventListener('change', e=>{
      if(e.target.type!=='checkbox') return;
      e.target.checked ? MSEL[key].add(e.target.value) : MSEL[key].delete(e.target.value);
      updMs(key); draw();
    });
    $('#'+c.p).querySelectorAll('.ms-actions button').forEach(b=>{
      b.addEventListener('click', ()=>{
        const boxes = $('#'+c.l).querySelectorAll('input');
        if(b.dataset.act==='all'){ boxes.forEach(x=>{x.checked=true; MSEL[key].add(x.value);}); }
        else { boxes.forEach(x=>x.checked=false); MSEL[key].clear(); }
        updMs(key); draw();
      });
    });
  });
  document.addEventListener('click', closeMs);
  document.querySelectorAll('.ms-panel').forEach(p=>p.addEventListener('click', e=>e.stopPropagation()));

  function streakCell(n){
    n=n||1; const cap=Math.min(n,6); let sq='';
    for(let i=0;i<6;i++) sq+=`<s class="${i<cap?'on':''}"></s>`;
    return `<span class="streak ${n>=2?'hot':''}" title="連續 ${n} 個月符合條件">${sq}<span class="n">${n}</span></span>`;
  }

  function load(){
    fetch('data/latest.json',{cache:'no-store'})
      .then(r=>r.ok?r.json():Promise.reject())
      .then(d=>{ $('#demoFlag').hidden=true; DATA=d; boot(); })
      .catch(()=>{ $('#demoFlag').hidden=false; DATA=DEMO; boot(); });
  }
  function boot(){
    $('#dataYm').textContent = DATA.data_ym||'—';
    $('#updatedAt').textContent = DATA.updated_at||'—';
    $('#statAll').textContent = (DATA.count_all||0).toLocaleString();
    $('#statHist').textContent = ' ／已累積 '+(DATA.history_months||1)+' 期';
    switchMode('momentum');
  }

  function switchMode(mode){
    MODE=mode; const cfg=MODES[mode];
    ['tabIndustry','tabMomentum','tabAll'].forEach(id=>$('#'+id).classList.remove('active'));
    $('#'+{industry:'tabIndustry',momentum:'tabMomentum',all:'tabAll'}[mode]).classList.add('active');

    $('#pageTitle').textContent = cfg.title;
    $('#pageLede').textContent  = cfg.lede;
    $('#pageFormula').innerHTML = cfg.formula;

    const isInd = !!cfg.isIndustry;
    $('#stockView').hidden = isInd;
    $('#industryView').hidden = !isInd;
    $('#toolbar').hidden = isInd;
    // 族群模式與自行篩選區沒有「符合條件/強度/連續」的概念，隱藏對應統計
    $('#statHitBox').hidden = isInd || mode==='all';
    $('#statTopBox').hidden = isInd || mode==='all';
    $('#statStreakBox').hidden = isInd || mode==='all';
    $('#fStreakField').hidden = mode==='all';   // 自行篩選區沒有連續入選概念

    if(isInd){ renderInd(); return; }

    ROWS = (DATA[cfg.dataKey]||[]).slice();
    if(mode==='momentum'){
      const n = DATA.count_momentum ?? ROWS.length;
      $('#statHit').firstChild.nodeValue = n.toLocaleString();
      $('#statPct').textContent = DATA.count_all ? ' ／占 '+(n/DATA.count_all*100).toFixed(1)+'%' : '';
      const top = ROWS.reduce((m,r)=>Math.max(m, r.momentum_score||0), 0);
      $('#statTop').textContent = top?top.toFixed(1):'—';
      $('#statStreak').firstChild.nodeValue = (DATA.count_momentum_streak_2plus||0).toLocaleString();
    }
    $('#cTotal').textContent = ROWS.length;

    SORT = {k:cfg.defaultSort, dir:-1};
    buildHead();
    buildMs('market',ROWS); buildMs('size',ROWS); buildMs('industry',ROWS);
    draw();
  }

  function buildHead(){
    $('#thead').innerHTML = LAYOUT[MODE].map(id=>{
      const c=COL[id], on = c.k===SORT.k;
      return `<th class="${c.txt?'txt':''} ${on?'sorted':''}" data-col="${id}">
        <button type="button" data-k="${c.k}">${c.label}${on?`<span class="arrow">${SORT.dir<0?'▼':'▲'}</span>`:''}</button></th>`;
    }).join('');
    $('#thead').querySelectorAll('button').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const k=btn.dataset.k;
        const isText = ['code','name','industry','size_tier'].includes(k);
        SORT = (SORT.k===k) ? {k,dir:SORT.dir*-1} : {k,dir:isText?1:-1};
        buildHead(); draw();
      });
    });
  }

  function filtered(){
    const k=parseInt($('#fStreak').value,10), q=$('#fQ').value.trim().toLowerCase();
    return ROWS.filter(x=>
      (MSEL.market.size===0   || MSEL.market.has(x.market)) &&
      (MSEL.size.size===0     || MSEL.size.has(x.size_tier)) &&
      (MSEL.industry.size===0 || MSEL.industry.has(x.industry)) &&
      (MODE==='all' || !k || (x.streak||1)>=k) &&
      (!q || (x.code||'').toLowerCase().includes(q) || (x.name||'').toLowerCase().includes(q))
    );
  }

  function sortRows(rows){
    const {k,dir}=SORT;
    if(k==='rank') return rows;
    return rows.sort((a,b)=>{
      const av=a[k], bv=b[k];
      if(av==null) return 1; if(bv==null) return -1;
      return (typeof av==='number') ? (av-bv)*dir : String(av).localeCompare(String(bv),'zh-Hant')*dir;
    });
  }

  function draw(){
    const rows = sortRows(filtered());
    $('#cShown').textContent = rows.length;
    $('#empty').hidden = rows.length>0;
    const cols = LAYOUT[MODE].map(id=>COL[id]);
    $('#tbody').innerHTML = rows.map((r,i)=>
      '<tr>'+cols.map(c=>`<td class="${c.txt?'txt':''} ${c.cell||''}">${c.get(r,i)}</td>`).join('')+'</tr>'
    ).join('');
  }

  // ---- CSV 匯出（給 Excel 用）----
  function exportCsv(){
    const rows = sortRows(filtered());
    if(!rows.length){ alert('目前條件下沒有資料可匯出'); return; }
    const head = ['股號','公司名稱','市場','產業別','市值規模','市值(億)',
                  '當月營收(千元)','累計營收(千元)','當月年增率(%)','累計年增率(%)','月增率(%)'];
    if(MODE==='momentum') head.push('強度分數','連續入選月數');
    const esc = v => {
      if(v==null) return '';
      const s = String(v);
      return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
    };
    const lines = rows.map(r=>{
      const base = [r.code, r.name, r.market, r.industry, r.size_tier,
                    r.market_cap_k!=null?(r.market_cap_k/100000).toFixed(1):'',
                    r.cur_revenue_k??'', r.cum_revenue_k??'',
                    r.cur_yoy??'', r.cum_yoy??'', r.mom??''];
      if(MODE==='momentum') base.push(r.momentum_score??'', r.streak??'');
      return base.map(esc).join(',');
    });
    // Excel 讀 UTF-8 CSV 需要 BOM，否則中文會變亂碼
    const csv = '\uFEFF' + [head.join(','), ...lines].join('\r\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ym = String(DATA.data_ym||'').replace(/\D/g,'') || 'data';
    a.href = url;
    a.download = `台股月營收_${MODE==='all'?'全部':'動能延續'}_${ym}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }

  // ---- 族群動能 ----
  function renderInd(){
    const list = (DATA.industries||[]).slice().sort((a,b)=>{
      const av=a[IND_METRIC], bv=b[IND_METRIC];
      if(av==null) return 1; if(bv==null) return -1;
      return bv-av;
    });
    if(!list.length){ $('#indBars').innerHTML='<div class="state"><b>尚無族群資料</b>等下次更新後就會出現。</div>'; return; }
    const maxAbs = Math.max(...list.map(r=>Math.abs(r[IND_METRIC]||0)), 1);
    $('#indBars').innerHTML = list.map(r=>{
      const v=r[IND_METRIC];
      if(v==null) return `<div class="ind-row"><div class="ind-name">${r.industry}</div><div class="ind-track"></div><div class="ind-val" style="color:#9AA5B1">—</div><div class="ind-meta">${fmtYi(r.cur_revenue_k)}億 · ${r.count}家</div></div>`;
      const p=v>=0, w=(Math.abs(v)/maxAbs)*50;
      return `<div class="ind-row">
        <div class="ind-name" title="${r.industry}">${r.industry}</div>
        <div class="ind-track"><span class="ind-bar ${p?'pos':'neg'}" style="width:${w}%"></span></div>
        <div class="ind-val ${p?'pos':'neg'}">${(v>0?'+':'')+v.toFixed(1)}%</div>
        <div class="ind-meta">${fmtYi(r.cur_revenue_k)}億 · ${r.count}家</div>
      </div>`;
    }).join('');
    $('#indNote').textContent = IND_METRIC==='mom'
      ? '月增率看短期動能轉折，容易受工作天數與季節性影響，適合抓變化的當下。'
      : '年增率排除季節性，看的是趨勢方向，比月增率穩定但反應較慢。';
  }
  document.querySelectorAll('.mbtn').forEach(b=>b.addEventListener('click',()=>{
    IND_METRIC=b.dataset.metric;
    document.querySelectorAll('.mbtn').forEach(x=>x.classList.toggle('active',x===b));
    renderInd();
  }));

  $('#tabIndustry').addEventListener('click',()=>switchMode('industry'));
  $('#tabMomentum').addEventListener('click',()=>switchMode('momentum'));
  $('#tabAll').addEventListener('click',()=>switchMode('all'));
  ['#fStreak','#fQ'].forEach(s=>$(s).addEventListener('input',draw));
  $('#btnCsv').addEventListener('click', exportCsv);
  $('#btnReset').addEventListener('click',()=>{
    $('#fQ').value=''; $('#fStreak').value='1';
    Object.keys(MS).forEach(k=>{
      MSEL[k].clear();
      $('#'+MS[k].l).querySelectorAll('input').forEach(c=>c.checked=false);
      updMs(k);
    });
    draw();
  });

  load();
})();
</script>
</body>
</html>
